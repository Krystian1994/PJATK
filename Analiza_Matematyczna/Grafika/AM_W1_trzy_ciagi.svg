<text x="370.0" y="30.0" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold">Twierdzenie o trzech ciągach („dwóch policjantów”)</text>
<text x="137.7" y="117.2" font-size="13.5" fill="#2563eb" text-anchor="start" font-weight="bold">cₙ = 1 + 1/n  (górny policjant)</text>
<text x="137.7" y="274.5" font-size="13.5" fill="#16a34a" text-anchor="start" font-weight="bold">aₙ = 1 − 1/n  (dolny policjant)</text>
<text x="341.0" y="137.2" font-size="13.5" fill="#dc2626" text-anchor="start" font-weight="bold">bₙ = 1 + sin(n)/n  (złapany pomiędzy)</text>
<text x="370.0" y="372.0" font-size="14" fill="#1f2937" text-anchor="middle">aₙ ≤ bₙ ≤ cₙ, oba policjanty idą do 1  ⇒  bₙ nie ma wyjścia i też idzie do 1</text>
